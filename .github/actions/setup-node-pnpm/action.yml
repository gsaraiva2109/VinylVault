name: Setup pnpm + Node
description: Installs pnpm and Node.js at the versions shared across release.yml's jobs, with pnpm caching.

inputs:
  cache-dependency-path:
    description: Path(s) passed through to actions/setup-node's cache-dependency-path
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      with:
        version: 9
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

name: Release

# GitHub is the source of truth for CI/CD: quality gates, semantic-release,
# GHCR image push, Dokploy deploy trigger, and Tauri (Linux + macOS) builds
# all run here. Forgejo is no longer involved in release/deploy.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Change Detection ──────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      rust: ${{ steps.filter.outputs.rust }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
              - 'pnpm-lock.yaml'
            backend:
              - 'api/**'
              - 'pnpm-lock.yaml'
            rust:
              - 'desktop/src-tauri/**'
              - 'desktop/sidecar/**'
              - 'desktop/package.json'
            ci:
              - '.github/workflows/**'
              - 'scripts/**'
              - 'Dockerfile'
              - '**/Dockerfile'
              - '.dockerignore'
              - '**/.dockerignore'

  # ── Secret Scan ───────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: 'fs'
          scanners: 'secret'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # ── Quality Gate: Frontend ────────────────────────────────────────────────
  check-frontend:
    name: Check Frontend
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: pnpm run lint
      - name: TypeScript check
        working-directory: web
        run: pnpm exec tsc --noEmit

  # ── Quality Gate: Backend ─────────────────────────────────────────────────
  check-backend:
    name: Check Backend
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Install deps
        working-directory: api
        run: pnpm install --frozen-lockfile
      - name: Backend typecheck
        working-directory: api
        run: pnpm exec tsc --noEmit
      - name: Backend build
        working-directory: api
        run: pnpm run build

  # ── Quality Gate: Rust / Tauri ────────────────────────────────────────────
  check-rust:
    name: Check Rust
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: [self-hosted, homelab, linux, amd64]
    container: localhost:5000/vinyl-vault-builder:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo registry
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-check-reg-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-reg-
      - name: Cache cargo target
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /tmp/cargo-target
          key: ${{ runner.os }}-cargo-check-target-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-target-
      - name: Cargo check
        working-directory: desktop/src-tauri
        env:
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          CARGO_TARGET_DIR: /tmp/cargo-target
          CARGO_BUILD_JOBS: '16'
          # Container jobs mount HOME=/github/home, overriding the image's
          # /root where rustup's toolchain config actually lives.
          RUSTUP_HOME: /root/.rustup
          CARGO_HOME: /root/.cargo
        run: cargo check --no-default-features

  # ── Semantic Release ─────────────────────────────────────────────────────
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [detect-changes, check-frontend, check-backend, check-rust]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.result != 'skipped' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    outputs:
      released: ${{ steps.sr.outputs.new_release_published }}
      version: ${{ steps.sr.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install semantic-release deps
        run: npm install
      - name: Run semantic-release
        id: sr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          npx semantic-release
          git fetch --tags
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$AFTER" ] && [ "$BEFORE" != "$AFTER" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${AFTER#v}" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi

  # ── Docker Build & Push ───────────────────────────────────────────────────
  build-and-push-images:
    name: Build & Push — ${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    needs: [detect-changes, check-frontend, check-backend, check-rust, release]
    if: ${{ always() && needs.detect-changes.result != 'skipped' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/dev' && needs.detect-changes.outputs.ci == 'true')) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - context: api
            image: vinyl-vault-api
            filter: backend
            has_api_url: 'false'
            runner: ubuntu-latest
          - context: web
            image: vinyl-vault-web
            filter: frontend
            has_api_url: 'true'
            runner: [self-hosted, homelab, linux, amd64]
    steps:
      - name: Check if image needs building
        id: check_skip
        run: |
          if [[ "${{ needs.detect-changes.outputs[matrix.filter] }}" != 'true' ]] && [[ "${{ needs.release.outputs.released }}" != 'true' ]]; then
            echo "SKIP=true" >> $GITHUB_OUTPUT
          else
            echo "SKIP=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check_skip.outputs.SKIP != 'true'
        with:
          ref: ${{ needs.release.outputs.released == 'true' && format('refs/tags/v{0}', needs.release.outputs.version) || github.ref }}

      - name: Read version
        if: steps.check_skip.outputs.SKIP != 'true'
        id: version
        run: |
          if [[ "${{ needs.release.outputs.released }}" == "true" ]]; then
            echo "version=${{ needs.release.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check_skip.outputs.SKIP != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker

      - name: Login to GHCR
        if: steps.check_skip.outputs.SKIP != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: steps.check_skip.outputs.SKIP != 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}

      - name: Resolve build args
        if: steps.check_skip.outputs.SKIP != 'true'
        id: build_args
        run: |
          if [ "${{ matrix.has_api_url }}" = "true" ]; then
            echo "args=NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> $GITHUB_OUTPUT
          else
            echo "args=" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        if: steps.check_skip.outputs.SKIP != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ steps.build_args.outputs.args }}
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}

      - name: Trigger Dokploy Deploy
        if: steps.check_skip.outputs.SKIP != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          WEBHOOK_PATH: ${{ matrix.image == 'vinyl-vault-api' && secrets.DOKPLOY_WEBHOOK_URL_API || secrets.DOKPLOY_WEBHOOK_URL_WEB }}
          DOKPLOY_HOST: ${{ vars.INTERNAL_DOKPLOY_HOST }}
        run: |
          if [ -n "$WEBHOOK_PATH" ]; then
            # If WEBHOOK_PATH is already a full URL, use it directly.
            # Otherwise prepend DOKPLOY_HOST (internal Dokploy address) —
            # the runner is on the homelab network, GHCR isn't.
            if echo "$WEBHOOK_PATH" | grep -q '^https\?://'; then
              WEBHOOK_URL="$WEBHOOK_PATH"
            else
              WEBHOOK_URL="${DOKPLOY_HOST}${WEBHOOK_PATH}"
            fi
            echo "Triggering Dokploy deploy for ${{ matrix.image }} → $WEBHOOK_URL"
            curl -k -L --post301 -X POST \
              -H "Content-Type: application/json" \
              -d "{}" \
              "$WEBHOOK_URL"
          else
            echo "::warning::Dokploy webhook URL not configured for ${{ matrix.image }}."
          fi

  # ── Tauri Linux AppImage ──────────────────────────────────────────────────
  build-tauri-linux:
    name: Build Tauri Linux AppImage
    runs-on: [self-hosted, homelab, linux, amd64]
    # Rust, system libs, and Python are pre-baked in the builder image stored
    # on the local homelab registry (bypasses Cloudflare 413 limit).
    container: localhost:5000/vinyl-vault-builder:latest
    needs: [detect-changes, check-frontend, check-backend, check-rust, release]
    if: |
      always() &&
      needs.detect-changes.result != 'skipped' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.release.outputs.released == 'true' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.released == 'true' && format('refs/tags/v{0}', needs.release.outputs.version) || github.ref }}

      - name: Set release version in workspace
        if: needs.release.outputs.released == 'true'
        run: bash scripts/sr-bump-version.sh ${{ needs.release.outputs.version }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-build-${{ hashFiles('web/pnpm-lock.yaml', 'desktop/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-build-

      # Rust and system libs are in the builder image — only compiled artefacts need caching.
      - name: Cache cargo registry
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-build-reg-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-reg-

      - name: Cache cargo target
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Install Next.js deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Tauri CLI deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Fix Next.js static export for Tauri
        run: |
          # Next.js 15 requires force-static for routes during static export.
          # We sed this at build time so the Web version stays dynamic.
          sed -i 's/force-dynamic/force-static/' web/app/api/auth/\[...nextauth\]/route.ts

      - name: Build Tauri AppImage
        working-directory: desktop
        env:
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          APPIMAGE_BUNDLE_GSTREAMER: '0'
        run: pnpm tauri build --target x86_64-unknown-linux-gnu

      - name: Verify build artifacts
        run: |
          find desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/ -type f \( -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.sig" \)

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vinyl-vault-linux-appimage
          path: |
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.tar.gz
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.sig
          retention-days: 30

  # ── Tauri macOS .dmg ───────────────────────────────────────────────────────
  build-tauri-macos:
    name: Build Tauri macOS .dmg
    runs-on: macos-latest
    needs: [release]
    if: ${{ needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.released == 'true' && format('refs/tags/v{0}', needs.release.outputs.version) || github.ref }}

      - name: Set release version in workspace
        if: needs.release.outputs.released == 'true'
        run: bash scripts/sr-bump-version.sh ${{ needs.release.outputs.version }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            web/pnpm-lock.yaml

      # aarch64-apple-darwin targets Apple Silicon (macos-latest is arm64).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-build-macos-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-macos-

      - name: Install Next.js deps
        working-directory: web
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile

      - name: Install Tauri CLI deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Fix Next.js static export for Tauri
        run: |
          # macOS uses BSD sed, which requires an empty backup string (-i '') for in-place edits.
          sed -i '' 's/force-dynamic/force-static/' web/app/api/auth/\[...nextauth\]/route.ts

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build Tauri macOS .dmg
        working-directory: desktop
        env:
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg,app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vinyl-vault-macos-dmg
          path: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

  # ── Publish Release Assets (Linux) ────────────────────────────────────────
  publish-linux-assets:
    name: Publish Linux Release Assets
    runs-on: ubuntu-latest
    needs: [build-tauri-linux, release]
    if: ${{ needs.build-tauri-linux.result == 'success' && needs.release.outputs.released == 'true' }}
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: vinyl-vault-linux-appimage
          path: dist/

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.release.outputs.version }}"
          VERSION="${{ needs.release.outputs.version }}"

          # Rename: "Vinyl Vault_*" → "Vinyl.Vault_*" (spaces → dots)
          find dist/ -type f | while IFS= read -r f; do
            new="$(echo "$f" | sed 's/ /./g')"
            [ "$f" != "$new" ] && mv "$f" "$new"
          done

          APPIMAGE=$(find dist/ -type f -name "*.AppImage" | head -1)
          UPDATER_BUNDLE=$(find dist/ -type f -name "*.tar.gz" | head -1)
          SIG_FILE=$(find dist/ -type f -name "*.sig" | head -1)

          if [ -z "$APPIMAGE" ]; then
            echo "::error::No raw AppImage found in dist/"
            exit 1
          fi
          if [ -z "$UPDATER_BUNDLE" ]; then
            UPDATER_BUNDLE="$APPIMAGE"
            echo "No .tar.gz found; using AppImage directly as updater bundle (Tauri v2 direct signing)"
          fi
          if [ -z "$SIG_FILE" ]; then
            echo "::error::No .sig found in dist/ — ensure TAURI_SIGNING_PRIVATE_KEY is set"
            exit 1
          fi

          sha256sum "$APPIMAGE" > SHA256SUMS.txt
          if [ "$UPDATER_BUNDLE" != "$APPIMAGE" ]; then
            sha256sum "$UPDATER_BUNDLE" >> SHA256SUMS.txt
          fi

          gh release upload "$TAG" "$APPIMAGE" SHA256SUMS.txt --clobber
          if [ "$UPDATER_BUNDLE" != "$APPIMAGE" ]; then
            gh release upload "$TAG" "$UPDATER_BUNDLE" "$SIG_FILE" --clobber
          else
            gh release upload "$TAG" "$SIG_FILE" --clobber
          fi

          # ── Merge linux-x86_64 entry into latest.json for the Tauri auto-updater ──
          UPDATER_NAME=$(basename "$UPDATER_BUNDLE")
          SIGNATURE=$(cat "$SIG_FILE")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${UPDATER_NAME}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          gh release download "$TAG" --pattern "latest.json" --output latest.json 2>/dev/null || echo '{}' > latest.json
          jq --arg version "$VERSION" --arg notes "See release notes on GitHub" --arg pub_date "$PUB_DATE" \
             --arg url "$DOWNLOAD_URL" --arg sig "$SIGNATURE" \
            '.version = $version | .notes = $notes | .pub_date = $pub_date |
             .platforms["linux-x86_64"] = {signature: $sig, url: $url}' \
            latest.json > latest.json.tmp && mv latest.json.tmp latest.json

          gh release upload "$TAG" latest.json --clobber

      - name: Add install instructions & checksums to release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.release.outputs.version }}"
          VERSION="${{ needs.release.outputs.version }}"

          CURRENT_BODY=$(gh release view "$TAG" --json body --jq '.body')
          INSTALL_SECTION=$(printf '## 📥 Install\n\n### Linux (x86_64)\n\nDownload the `.AppImage` below:\n\n```sh\nchmod +x Vinyl.Vault_*.AppImage\n./Vinyl.Vault_*.AppImage\n```\n\n### macOS (Apple Silicon)\n\nDownload the `.dmg` below, open it, and drag Vinyl Vault to your Applications folder. Then remove the quarantine flag so macOS allows the unsigned app to launch:\n\n```sh\nxattr -cr /Applications/Vinyl\\ Vault.app\n```')
          SHA256_SECTION=$(printf '### 🔐 SHA256 Checksums (Linux)\n\n```\n%s\n```' "$(cat SHA256SUMS.txt)")
          NEW_BODY=$(printf '%s\n\n%s\n\n%s' "$CURRENT_BODY" "$INSTALL_SECTION" "$SHA256_SECTION")

          gh release edit "$TAG" --notes "$NEW_BODY"

  # ── Publish Release Assets (macOS) ────────────────────────────────────────
  publish-macos-assets:
    name: Publish macOS Release Assets
    runs-on: macos-latest
    # Depends on publish-linux-assets so latest.json merges are never racing.
    needs: [build-tauri-macos, publish-linux-assets, release]
    if: ${{ needs.build-tauri-macos.result == 'success' && needs.release.outputs.released == 'true' }}
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: vinyl-vault-macos-dmg
          path: dist/

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.release.outputs.version }}"

          find dist/ -type f | while IFS= read -r f; do
            new="$(echo "$f" | sed 's/ /./g')"
            [ "$f" != "$new" ] && mv "$f" "$new"
          done

          DMG=$(find dist/ -name "*.dmg" | head -1)
          UPDATER_TGZ=$(find dist/ -name "*.app.tar.gz" | head -1)
          UPDATER_SIG=$(find dist/ -name "*.app.tar.gz.sig" | head -1)

          if [ -z "$DMG" ]; then
            echo "::error::No .dmg found in dist/"
            exit 1
          fi

          shasum -a 256 "$DMG" > SHA256SUMS-macos.txt
          gh release upload "$TAG" "$DMG" SHA256SUMS-macos.txt --clobber

          if [ -n "$UPDATER_TGZ" ] && [ -n "$UPDATER_SIG" ]; then
            gh release upload "$TAG" "$UPDATER_TGZ" "$UPDATER_SIG" --clobber

            TGZ_NAME=$(basename "$UPDATER_TGZ")
            SIGNATURE=$(cat "$UPDATER_SIG")
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${TGZ_NAME}"

            gh release download "$TAG" --pattern "latest.json" --output latest.json 2>/dev/null || echo '{}' > latest.json
            jq --arg sig "$SIGNATURE" --arg url "$DOWNLOAD_URL" \
              '.platforms["darwin-aarch64"] = {signature: $sig, url: $url}' \
              latest.json > latest.json.tmp && mv latest.json.tmp latest.json
            gh release upload "$TAG" latest.json --clobber
          else
            echo "::warning::Updater artifacts (.app.tar.gz / .sig) not found — skipping darwin-aarch64 latest.json entry"
          fi

      - name: Add macOS checksums to release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.release.outputs.version }}"
          CURRENT_BODY=$(gh release view "$TAG" --json body --jq '.body')
          SHA256_SECTION=$(printf '### 🔐 SHA256 Checksums (macOS)\n\n```\n%s\n```' "$(cat SHA256SUMS-macos.txt)")
          NEW_BODY=$(printf '%s\n\n%s' "$CURRENT_BODY" "$SHA256_SECTION")
          gh release edit "$TAG" --notes "$NEW_BODY"

name: Build Builder Image

# Rebuilds the CI builder image when the Dockerfile changes.
# After this runs, release.yml can use:
#   container: localhost:5000/vinyl-vault-builder:latest
# in check-rust / build-tauri-linux to skip apt-get and Rust install entirely.
on:
  push:
    branches: [main, dev]
    paths:
      - 'docker/builder.Dockerfile'
  workflow_dispatch: {}

jobs:
  build-builder-image:
    name: Build & Push Builder Image
    runs-on: [self-hosted, homelab, linux, amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # Use a builder that can push to localhost (insecure registry)
          driver-opts: network=host

      - name: Build and push builder image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker
          file: docker/builder.Dockerfile
          push: true
          tags: localhost:5000/vinyl-vault-builder:latest
          # Layer cache stored locally — no external registry in the path
          cache-from: type=registry,ref=localhost:5000/vinyl-vault-builder:cache
          cache-to: type=registry,ref=localhost:5000/vinyl-vault-builder:cache,mode=max

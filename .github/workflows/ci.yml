name: CI

# PR-validation only: change detection, secret scan, and quality gates.
# Runs on every push/PR to main and dev. The release build/publish pipeline
# (docker images, Tauri builds, asset publish) lives in release.yml and only
# fires on push to main, gated on an actual release-please release (#208).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Change Detection ──────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      rust: ${{ steps.filter.outputs.rust }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
              - 'pnpm-lock.yaml'
            backend:
              - 'api/**'
              - 'pnpm-lock.yaml'
            rust:
              - 'desktop/src-tauri/**'
              - 'desktop/sidecar/**'
              - 'desktop/package.json'
            ci:
              - '.github/workflows/**'
              - 'scripts/**'
              - 'Dockerfile'
              - '**/Dockerfile'
              - '.dockerignore'
              - '**/.dockerignore'

  # ── Secret Scan ───────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: 'fs'
          scanners: 'secret'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # ── Quality Gate: Frontend ────────────────────────────────────────────────
  check-frontend:
    name: Check Frontend
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: pnpm run lint
      - name: TypeScript check
        working-directory: web
        run: pnpm exec tsc --noEmit

  # ── Quality Gate: Backend ─────────────────────────────────────────────────
  check-backend:
    name: Check Backend
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Install deps
        working-directory: api
        run: pnpm install --frozen-lockfile
      - name: Backend build
        # tsc (no --noEmit) already type-checks and fails the job on errors —
        # a separate `tsc --noEmit` pass first would recompile the same files twice.
        working-directory: api
        run: pnpm run build

  # ── Quality Gate: Rust / Tauri ────────────────────────────────────────────
  check-rust:
    name: Check Rust
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, homelab, linux, amd64]
    container: localhost:5000/vinyl-vault-builder:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo registry
        # Shared key with build-tauri-linux's registry cache in release.yml —
        # same Cargo.lock, same registry; only the target dir needs to differ.
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg-
      - name: Cache cargo target
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /tmp/cargo-target
          key: ${{ runner.os }}-cargo-check-target-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-target-
      - name: Cargo check
        working-directory: desktop/src-tauri
        env:
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          CARGO_TARGET_DIR: /tmp/cargo-target
          CARGO_BUILD_JOBS: '16'
          # Container jobs mount HOME=/github/home, overriding the image's
          # /root where rustup's toolchain config actually lives.
          RUSTUP_HOME: /root/.rustup
          CARGO_HOME: /root/.cargo
        run: cargo check --no-default-features

      # Container jobs run as root, so files they write (e.g. Tauri's
      # generated gen/schemas/*.json) end up root-owned in the workspace
      # bind-mount. The next job's checkout runs as the plain runner user
      # and can't clean/delete them — hand ownership back before exiting.
      - name: Fix workspace ownership for next job
        if: always()
        # Reference the parent dir, not GITHUB_WORKSPACE itself — the container
        # (running as root) owns the workspace dir by now, but its parent was
        # created by the runner service (saraivalab) before any container ran.
        run: chown -R "$(stat -c '%u:%g' "$(dirname "$GITHUB_WORKSPACE")")" "$GITHUB_WORKSPACE"

  # ── Docker Image Vulnerability Scan (PR-time) ───────────────────────────────
  # Catches a HIGH/CRITICAL vuln introduced by a Dockerfile or dependency
  # change before it merges, rather than only after it's already pushed to
  # GHCR (see release.yml's release-time scan, #209). Builds locally
  # (push: false, load: true) — never touches the registry.
  docker-scan:
    name: Docker (image vuln scan) — ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: api
            image: vinyl-vault-api
            filter: backend
          - context: web
            image: vinyl-vault-web
            filter: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.image }}:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Run Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          image-ref: ${{ matrix.image }}:pr-${{ github.event.pull_request.number || github.sha }}
          scan-type: 'image'
          format: 'sarif'
          output: 'trivy-image-${{ matrix.image }}.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: trivy-image-${{ matrix.image }}.sarif
          category: trivy-image-${{ matrix.image }}

  # ── CI Status Gate ─────────────────────────────────────────────────────────
  # Single required check for branch protection — rolls every required job's
  # result into one pass/fail so protection rules (and new quality jobs) only
  # need to reference this job, not each one individually. A "skipped" result
  # (detect-changes said that path didn't change) is not a failure; only an
  # actual "failure" trips the gate.
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [detect-changes, secret-scan, check-frontend, check-backend, check-rust, docker-scan]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.detect-changes.result }}" == "failure" ||
                "${{ needs.secret-scan.result }}" == "failure" ||
                "${{ needs.check-frontend.result }}" == "failure" ||
                "${{ needs.check-backend.result }}" == "failure" ||
                "${{ needs.check-rust.result }}" == "failure" ||
                "${{ needs.docker-scan.result }}" == "failure" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed or were skipped (no relevant changes)."
